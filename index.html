<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Self Coach · retour</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px system-ui, sans-serif; background: #f5f4ef; color: #1b1c19; }
  @media (prefers-color-scheme: dark) { body { background: #121311; color: #ecebe5; } }
  main { max-width: 420px; padding: 24px 16px; text-align: center; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <p>Retour vers Self Coach…</p>
  <p id="lien" hidden><a href="http://localhost:5173/">Ouvrir Self Coach</a> (l'app doit tourner sur ce Mac).</p>
  <p id="tel" hidden><a id="tel-lien" href="#">Revenir dans l'app Self Coach</a></p>
</main>
<script>
  // Relais de connexion : Withings exige une adresse https publique. Cette page renvoie aussitôt le code
  // d'autorisation (inutile sans la clé secrète, gardée dans l'app) vers l'app locale. Rien n'est enregistré ici.
  // Téléphone (état « tel. … ») : retour dans l'app Android par son lien ; sinon vers l'app du Mac.
  var q = location.search;
  var retour = /[?&](code|error)=/.test(q) && /[?&]state=/.test(q);
  var tel = /[?&]state=tel\./.test(q);
  if (retour && tel) {
    var app = 'intent://withings' + q + '#Intent;scheme=com.ben.selfcoach;package=com.ben.selfcoach;end';
    document.getElementById('tel-lien').href = app;
    document.getElementById('tel').hidden = false;
    location.replace(app);
  } else if (retour) location.replace('http://localhost:5173/' + q);
  else document.getElementById('lien').hidden = false;
</script>
</body>
</html>
